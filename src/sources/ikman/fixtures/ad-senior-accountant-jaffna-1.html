ications in CA Sri Lanka (Chartered Accountancy), CIMA or ACCA are highly preferred.\n- Minimum 3–5 years of relevant professional experience. Candidates with 5–10 years of experience are particularly encouraged to apply.\n- Previous experience in an audit firm or accounting practice will be a strong advantage.\n- Sound knowledge of accounting principles, financial reporting, reconciliations and internal controls.\n- Experience in quality assurance, compliance reviews or internal auditing is highly desirable.\n- Knowledge of project accounting, contract management and financial monitoring is an advantage.\n- Strong understanding of ERP systems and accounting software.\n- Advanced Microsoft Excel skills are essential.\n- Experience with Power BI, data analytics and AI tools will be an added advantage.\n- Knowledge of Norwegian accounting practices is an advantage, but not mandatory.\n- Excellent written and spoken English communication skills are mandatory.\n- Norwegian language skills will be considered an additional advantage.\n\n\nPersonal Attributes\n\n- Highly organized, analytical and detail-oriented.\n- Strong sense of responsibility, accountability and ownership.\n- Proactive, self-motivated and solution-oriented.\n- Ability to work independently and collaboratively.\n- Excellent problem-solving and decision-making abilities.\n- Confident in providing professional feedback and recommendations to management.\n- Ability to translate financial data into practical recommendations.\n- Strong interpersonal and communication skills.\n- Comfortable managing multiple responsibilities and meeting deadlines.\n- Willingness to learn, adapt and continuously improve.\n- Positive attitude and commitment to teamwork.\n\n\nWhat We Offer\n\n- Opportunity to work with a Norwegian accounting firm and an international team.\n- A responsible role with direct involvement in quality assurance and process development.\n- Professional exposure to Norwegian accounting practices and fin
